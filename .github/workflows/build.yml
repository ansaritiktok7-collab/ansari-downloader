name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/ansari/downloader app/src/main/res/layout gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ansari.downloader'
            compileSdk 34
            defaultConfig {
              applicationId "com.ansari.downloader"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Ansari Downloader" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="16dp" android:gravity="center">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ansari Downloader" android:textSize="24sp" android:textStyle="bold"/>
            <EditText android:id="@+id/urlInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Link paste karo"/>
            <Button android:id="@+id/downloadBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="DOWNLOAD"/>
            <TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Ready"/>
          </LinearLayout>
          EOF
          cat > app/src/main/java/com/ansari/downloader/MainActivity.kt << 'EOF'
          package com.ansari.downloader
          import android.app.DownloadManager
          import android.content.Context
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_main)
              val input=findViewById<EditText>(R.id.urlInput)
              val status=findViewById<TextView>(R.id.status)
              findViewById<Button>(R.id.downloadBtn).setOnClickListener {
                try {
                  val req=DownloadManager.Request(Uri.parse(input.text.toString()))
                  req.setTitle("Ansari")
                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "ansari_"+System.currentTimeMillis()+".mp4")
                  (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                  status.text="Download Started!"
                } catch(e: Exception){ status.text=e.message }
              }
            }
          }
          EOF
          gradle wrapper
          chmod +x./gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ansari-APK
          path: app/build/outputs/apk/debug/*.apk
