name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
      - name: Create project
        run: |
          rm -rf app build.gradle settings.gradle gradlew gradlew.bat gradle local.properties
          mkdir -p app/src/main/java/com/ansari/downloader
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          printf '%s\n' "plugins { id 'com.android.application' }" "android { namespace 'com.ansari.downloader'; compileSdk 34; defaultConfig { applicationId \"com.ansari.downloader\"; minSdk 21; targetSdk 34; versionCode 1; versionName \"1.0\" }; buildTypes { release { minifyEnabled false } } }" "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          printf '%s\n' "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><uses-permission android:name=\"android.permission.INTERNET\"/><application android:label=\"Ansari Downloader\"><activity android:name=\".MainActivity\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          printf '%s\n' "<?xml version=\"1.0\" encoding=\"utf-8\"?><LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\" android:layout_width=\"match_parent\" android:layout_height=\"match_parent\" android:orientation=\"vertical\" android:gravity=\"center\" android:padding=\"24dp\"><TextView android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\" android:text=\"Ansari Downloader\" android:textSize=\"24sp\" android:textStyle=\"bold\"/><EditText android:id=\"@+id/url_input\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:hint=\"Paste Link\" android:layout_marginTop=\"20dp\"/><Button android:id=\"@+id/btn\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:text=\"DOWNLOAD\" android:layout_marginTop=\"20dp\"/><TextView android:id=\"@+id/status\" android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\" android:text=\"Ready\" android:layout_marginTop=\"20dp\"/></LinearLayout>" > app/src/main/res/layout/activity_main.xml
          printf '%s\n' "package com.ansari.downloader; import android.app.DownloadManager; import android.content.Context; import android.net.Uri; import android.os.Bundle; import android.os.Environment; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); EditText input=findViewById(R.id.url_input); Button btn=findViewById(R.id.btn); TextView status=findViewById(R.id.status); btn.setOnClickListener(v->{ String url=input.getText().toString(); if(url.isEmpty()){status.setText(\"Link dalo\"); return;} DownloadManager.Request req=new DownloadManager.Request(Uri.parse(url)); req.setTitle(\"Ansari Download\"); req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, \"video_\"+System.currentTimeMillis()+\".mp4\"); req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED); ((DownloadManager)getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(req); status.setText(\"Download Started\"); }); } }" > app/src/main/java/com/ansari/downloader/MainActivity.java
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper
      - name: Build APK
        run:./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ansari-Downloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
