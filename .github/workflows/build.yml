name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/ansari/downloader
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.ansari.downloader'; compileSdk 34; defaultConfig { applicationId "com.ansari.downloader"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }; buildTypes { release { minifyEnabled false } } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Ansari Downloader"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ansari Downloader" android:textSize="24sp" android:textStyle="bold"/><EditText android:id="@+id/url_input" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Paste Link Here" android:layout_marginTop="20dp"/><Button android:id="@+id/btn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="DOWNLOAD" android:layout_marginTop="20dp"/><TextView android:id="@+id/status" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ready" android:layout_marginTop="20dp"/></LinearLayout>
          EOF
          cat > app/src/main/java/com/ansari/downloader/MainActivity.kt <<'EOF'
          package com.ansari.downloader
          import android.app.DownloadManager; import android.content.Context; import android.net.Uri; import android.os.Bundle; import android.os.Environment; import android.widget.*; import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); val input=findViewById<EditText>(R.id.url_input); val btn=findViewById<Button>(R.id.btn); val status=findViewById<TextView>(R.id.status); btn.setOnClickListener { val url=input.text.toString(); if(url.isEmpty()){status.text="Link dalo"; return@setOnClickListener}; val req=DownloadManager.Request(Uri.parse(url)); req.setTitle("Ansari Download"); req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "video_"+System.currentTimeMillis()+".mp4"); req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED); (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req); status.text="Download Started" } } }
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ansari-Downloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
